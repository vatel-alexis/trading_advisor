services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading_advisor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_advisor"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://trading:trading@db:5432/trading_advisor
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Healthy once the migrations ran and uvicorn answers, so the worker never sees an old schema.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 20

  worker:
    build: ./backend
    restart: unless-stopped
    command: python -m app.worker
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://trading:trading@db:5432/trading_advisor
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
